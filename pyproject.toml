[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr1me-engine"
version = "1.0.0"
description = "PR1ME Labs YouTube Shorts automation engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "PR1M3 Labs" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
pr1me = "pr1me.cli.main:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/pr1me"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "A"]
# UP046: PG-695 type-param syntax (marginal churn on generics we already annotate).
# B027: a no-op lifecycle hook (e.g. BaseProvider.close) is intentional.
ignore = ["A003", "UP046", "B027"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true